AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Sentasity Managed Access Roles
  Deploys IAM roles using AWS managed policies for cross-account access.
  MODES:
  1. Standalone: Creates roles in THIS account only.
  2. Organization: Creates roles in payer account + StackSet for all member accounts.

  Roles (toggle each on/off):
  - SentasityReadOnlyRole: ReadOnlyAccess for cost data and CUR access
  - SentasityPowerUserRole: PowerUserAccess for troubleshooting (no IAM changes)
  - SentasityAdminRole: AdministratorAccess for full access when needed

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Role Selection"
        Parameters:
          - EnableReadOnlyRole
          - EnablePowerUserRole
          - EnableAdminRole
      - Label:
          default: "Deployment Configuration"
        Parameters:
          - DeploymentScope
          - SharedServicesAccountId
      - Label:
          default: "Organization Deployment (Payer Account Only)"
        Parameters:
          - TrustedAccessEnabled
          - OrganizationRootId
    ParameterLabels:
      EnableReadOnlyRole:
        default: "Enable ReadOnly Role"
      EnablePowerUserRole:
        default: "Enable PowerUser Role"
      EnableAdminRole:
        default: "Enable Admin Role"
      DeploymentScope:
        default: "Where to deploy these roles"
      SharedServicesAccountId:
        default: "Sentasity Shared Services Account ID"
      TrustedAccessEnabled:
        default: "StackSets trusted access is enabled"
      OrganizationRootId:
        default: "Organization Root ID (r-xxxx)"

Parameters:
  EnableReadOnlyRole:
    Type: String
    Description: "Create SentasityReadOnlyRole with AWS ReadOnlyAccess managed policy"
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  EnablePowerUserRole:
    Type: String
    Description: "Create SentasityPowerUserRole with AWS PowerUserAccess managed policy"
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  EnableAdminRole:
    Type: String
    Description: "Create SentasityAdminRole with AWS AdministratorAccess managed policy"
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  DeploymentScope:
    Type: String
    Description: "Standalone = this account only | Organization = payer + all member accounts"
    Default: Standalone
    AllowedValues:
      - Standalone
      - Organization

  SharedServicesAccountId:
    Type: String
    Description: "Sentasity Shared Services Account ID (do not change)"
    Default: "886557787053"

  TrustedAccessEnabled:
    Type: String
    Description: "Organization only: Confirm StackSets trusted access is enabled in your org"
    Default: 'No'
    AllowedValues:
      - 'No'
      - 'Yes'

  OrganizationRootId:
    Type: String
    Description: "Organization only: Root ID (e.g., r-xxxx). Find via: aws organizations list-roots"
    Default: ''
    AllowedPattern: ^(r-[a-z0-9]+)?$
    ConstraintDescription: Must be empty or a Root ID starting with r- (e.g., r-xxxx)

Conditions:
  # Organization mode checks
  IsOrgDeployment: !And
    - !Equals [!Ref DeploymentScope, 'Organization']
    - !Equals [!Ref TrustedAccessEnabled, 'Yes']

  # Role creation in this account (payer or standalone)
  ShouldCreateRoles: !Or
    - !Equals [!Ref DeploymentScope, 'Standalone']
    - !And
      - !Equals [!Ref DeploymentScope, 'Organization']
      - !Equals [!Ref TrustedAccessEnabled, 'Yes']

  # Individual role conditions
  CreateReadOnly: !And
    - !Condition ShouldCreateRoles
    - !Equals [!Ref EnableReadOnlyRole, 'true']
  CreatePowerUser: !And
    - !Condition ShouldCreateRoles
    - !Equals [!Ref EnablePowerUserRole, 'true']
  CreateAdmin: !And
    - !Condition ShouldCreateRoles
    - !Equals [!Ref EnableAdminRole, 'true']

  # StackSet conditions (need org mode + at least one role enabled)
  CreateStackSet: !And
    - !Condition IsOrgDeployment
    - !Or
      - !Equals [!Ref EnableReadOnlyRole, 'true']
      - !Equals [!Ref EnablePowerUserRole, 'true']
      - !Equals [!Ref EnableAdminRole, 'true']

Rules:
  ValidateOrgDeployment:
    RuleCondition: !Equals [!Ref DeploymentScope, 'Organization']
    Assertions:
      - Assert: !Equals [!Ref TrustedAccessEnabled, 'Yes']
        AssertDescription: "You must confirm StackSets trusted access is enabled before deploying to organization."
      - Assert: !Not [!Equals [!Ref OrganizationRootId, '']]
        AssertDescription: "Organization Root ID is required for Organization deployment. Find it via: aws organizations list-roots"

  ValidateAtLeastOneRole:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref EnableReadOnlyRole, 'true']
          - !Equals [!Ref EnablePowerUserRole, 'true']
          - !Equals [!Ref EnableAdminRole, 'true']
        AssertDescription: "At least one role must be enabled."

Resources:
  # =========================================================
  # ROLES: Created in THIS account (Standalone or Payer)
  # =========================================================

  SentasityReadOnlyRole:
    Type: AWS::IAM::Role
    Condition: CreateReadOnly
    Properties:
      RoleName: SentasityReadOnlyRole
      Description: "Sentasity ReadOnly role for cost data and CUR access"
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${SharedServicesAccountId}:root"
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/ReadOnlyAccess"
      Policies:
        - PolicyName: SentasityCURDiscovery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CURDiscovery
                Effect: Allow
                Action:
                  # Legacy CUR API (pre-2023)
                  - cur:DescribeReportDefinitions
                  # BCM Data Exports API (CUR 2.0)
                  - bcm-data-exports:ListExports
                  - bcm-data-exports:GetExport
                Resource: "*"
      Tags:
        - Key: "ManagedBy"
          Value: "Sentasity-CloudFormation"
        - Key: "Purpose"
          Value: "Cost and usage data access"

  SentasityPowerUserRole:
    Type: AWS::IAM::Role
    Condition: CreatePowerUser
    Properties:
      RoleName: SentasityPowerUserRole
      Description: "Sentasity PowerUser role for troubleshooting and fixes"
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${SharedServicesAccountId}:root"
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/PowerUserAccess"
      Tags:
        - Key: "ManagedBy"
          Value: "Sentasity-CloudFormation"
        - Key: "Purpose"
          Value: "Troubleshooting and remediation"

  SentasityAdminRole:
    Type: AWS::IAM::Role
    Condition: CreateAdmin
    Properties:
      RoleName: SentasityAdminRole
      Description: "Sentasity Admin role for full access when needed"
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${SharedServicesAccountId}:root"
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AdministratorAccess"
      Tags:
        - Key: "ManagedBy"
          Value: "Sentasity-CloudFormation"
        - Key: "Purpose"
          Value: "Full administrative access"

  # =========================================================
  # STACKSET: Deploys roles to member accounts (Org mode only)
  # =========================================================
  SentasityManagedAccessStackSet:
    Type: AWS::CloudFormation::StackSet
    Condition: CreateStackSet
    Properties:
      StackSetName: "Sentasity-Managed-Access-Roles"
      Description: "Deploys Sentasity managed access roles to member accounts"
      PermissionModel: SERVICE_MANAGED
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      CallAs: SELF
      Capabilities:
        - CAPABILITY_NAMED_IAM
      OperationPreferences:
        MaxConcurrentPercentage: 10
        FailureTolerancePercentage: 5
        RegionConcurrencyType: PARALLEL
      Parameters:
        - ParameterKey: TrustedAccountId
          ParameterValue: !Ref SharedServicesAccountId
        - ParameterKey: EnableReadOnlyRole
          ParameterValue: !Ref EnableReadOnlyRole
        - ParameterKey: EnablePowerUserRole
          ParameterValue: !Ref EnablePowerUserRole
        - ParameterKey: EnableAdminRole
          ParameterValue: !Ref EnableAdminRole
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds:
              - !Ref OrganizationRootId
          Regions:
            - "us-east-1"
      TemplateBody: |
        AWSTemplateFormatVersion: '2010-09-09'
        Description: "Sentasity Managed Access Roles (Member Account)"
        Parameters:
          TrustedAccountId:
            Type: String
          EnableReadOnlyRole:
            Type: String
            Default: 'true'
          EnablePowerUserRole:
            Type: String
            Default: 'false'
          EnableAdminRole:
            Type: String
            Default: 'false'
        Conditions:
          CreateReadOnly: !Equals [!Ref EnableReadOnlyRole, 'true']
          CreatePowerUser: !Equals [!Ref EnablePowerUserRole, 'true']
          CreateAdmin: !Equals [!Ref EnableAdminRole, 'true']
        Resources:
          SentasityReadOnlyRole:
            Type: AWS::IAM::Role
            Condition: CreateReadOnly
            Properties:
              RoleName: SentasityReadOnlyRole
              Description: "Sentasity ReadOnly role for cost data and CUR access"
              MaxSessionDuration: 43200
              AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                      AWS: !Sub "arn:aws:iam::${TrustedAccountId}:root"
                    Action: sts:AssumeRole
              ManagedPolicyArns:
                - "arn:aws:iam::aws:policy/ReadOnlyAccess"
              Policies:
                - PolicyName: SentasityCURDiscovery
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Sid: CURDiscovery
                        Effect: Allow
                        Action:
                          - cur:DescribeReportDefinitions
                          - bcm-data-exports:ListExports
                          - bcm-data-exports:GetExport
                        Resource: "*"
              Tags:
                - Key: "ManagedBy"
                  Value: "Sentasity-CloudFormation"
                - Key: "Purpose"
                  Value: "Cost and usage data access"
          SentasityPowerUserRole:
            Type: AWS::IAM::Role
            Condition: CreatePowerUser
            Properties:
              RoleName: SentasityPowerUserRole
              Description: "Sentasity PowerUser role for troubleshooting and fixes"
              MaxSessionDuration: 43200
              AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                      AWS: !Sub "arn:aws:iam::${TrustedAccountId}:root"
                    Action: sts:AssumeRole
              ManagedPolicyArns:
                - "arn:aws:iam::aws:policy/PowerUserAccess"
              Tags:
                - Key: "ManagedBy"
                  Value: "Sentasity-CloudFormation"
                - Key: "Purpose"
                  Value: "Troubleshooting and remediation"
          SentasityAdminRole:
            Type: AWS::IAM::Role
            Condition: CreateAdmin
            Properties:
              RoleName: SentasityAdminRole
              Description: "Sentasity Admin role for full access when needed"
              MaxSessionDuration: 43200
              AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                      AWS: !Sub "arn:aws:iam::${TrustedAccountId}:root"
                    Action: sts:AssumeRole
              ManagedPolicyArns:
                - "arn:aws:iam::aws:policy/AdministratorAccess"
              Tags:
                - Key: "ManagedBy"
                  Value: "Sentasity-CloudFormation"
                - Key: "Purpose"
                  Value: "Full administrative access"

Outputs:
  ReadOnlyRoleArn:
    Condition: CreateReadOnly
    Value: !GetAtt SentasityReadOnlyRole.Arn
    Description: "SentasityReadOnlyRole ARN"

  PowerUserRoleArn:
    Condition: CreatePowerUser
    Value: !GetAtt SentasityPowerUserRole.Arn
    Description: "SentasityPowerUserRole ARN"

  AdminRoleArn:
    Condition: CreateAdmin
    Value: !GetAtt SentasityAdminRole.Arn
    Description: "SentasityAdminRole ARN"

  StackSetId:
    Condition: CreateStackSet
    Value: !Ref SentasityManagedAccessStackSet
    Description: "StackSet ID for organization deployment"
