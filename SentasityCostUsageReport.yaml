AWSTemplateFormatVersion: '2010-09-09'
Description: "Sentasity CUR 1.0 (Parquet) bucket and report. Deploy in us-east-1."

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Report Configuration"
        Parameters:
          - ReportName
    ParameterLabels:
      ReportName:
        default: "CUR report name"

Parameters:
  ReportName:
    Type: String
    Description: "CUR report name; part of the S3 path."
    Default: "sentasity-cur"
    AllowedPattern: ^[a-zA-Z0-9][a-zA-Z0-9\-]{0,253}[a-zA-Z0-9]$
    ConstraintDescription: "2-255 letters, numbers and hyphens; no leading or trailing hyphen."

Resources:
  CURBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "sentasity-cur-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: "ManagedBy"
          Value: "Sentasity-CloudFormation"
        - Key: "Purpose"
          Value: "AWS Cost and Usage Report storage"

  CURBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CURBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCURServiceGetBucketAcl
            Effect: Allow
            Principal:
              Service: billingreports.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CURBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
          - Sid: AllowCURServicePutObject
            Effect: Allow
            Principal:
              Service: billingreports.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${CURBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"

  CURReportDefinition:
    Type: AWS::CUR::ReportDefinition
    DependsOn: CURBucketPolicy
    Properties:
      ReportName: !Ref ReportName
      TimeUnit: HOURLY
      Format: Parquet
      Compression: Parquet
      AdditionalSchemaElements:
        - RESOURCES
      S3Bucket: !Ref CURBucket
      S3Prefix: cur
      S3Region: us-east-1
      ReportVersioning: OVERWRITE_REPORT
      RefreshClosedReports: true

Outputs:
  # Bump on every template change; the daily stack sync reads it.
  TemplateVersion:
    Description: "Template version"
    Value: "3"

  BucketName:
    Value: !Ref CURBucket
    Description: "CUR bucket"

  ReportName:
    Value: !Ref ReportName
    Description: "CUR report name"

  ReportPrefix:
    Value: cur
    Description: "CUR S3 prefix"

  AccountId:
    Value: !Ref "AWS::AccountId"
    Description: "Bucket account ID"
