AWSTemplateFormatVersion: '2010-09-09'
Description: "Sentasity read-only access roles for one AWS account (cost and security)."

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Sentasity access"
        Parameters:
          - SentasityExternalId
      - Label:
          default: "Wrong-account check"
        Parameters:
          - SentasityAccountId
    ParameterLabels:
      SentasityExternalId:
        default: "Sentasity External ID"
      SentasityAccountId:
        default: "Only create in AWS account (optional)"

Parameters:
  SentasityExternalId:
    Type: String
    AllowedPattern: '^[\w+=,.@:\/-]{2,1224}$'
    ConstraintDescription: "2 to 1224 letters, digits, or + = , . @ : / - _"
    Description: "External ID from Sentasity. The Sentasity quick-create link fills it in."
  SentasityAccountId:
    Type: String
    Default: ""
    AllowedPattern: '^(\d{12})?$'
    ConstraintDescription: "Blank, or a 12-digit AWS account ID"
    Description: "Sentasity's setup links fill this in, so the stack can't be created in another account by mistake. Leave it blank when updating the stack or deploying by hand."

Rules:
  # A Sentasity quick-create link names the account it is for. Opened while
  # signed in to another account, the stack is refused before anything is
  # created. Blank checks nothing.
  MustBeTheLinkedAccount:
    RuleCondition: !Not [!Equals [!Ref SentasityAccountId, ""]]
    Assertions:
      - Assert: !Equals [!Ref SentasityAccountId, !Ref "AWS::AccountId"]
        AssertDescription: "This link is for the AWS account in 'Only create in AWS account', not this one. Sign in to that account and open the link again."

Resources:

  SentasityViewOnlySecurityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SentasityViewOnlySecurityRole
      Description: "Sentasity ViewOnly access for cost optimization and security scanning"
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: "arn:aws:iam::886557787053:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref SentasityExternalId
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/job-function/ViewOnlyAccess"
        - "arn:aws:iam::aws:policy/SecurityAudit"
      Policies:
        - PolicyName: SecurityScanReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowAdditionalSecurityReads
                Effect: Allow
                Action:
                  - "account:Get*"
                  - "amplify:ListApps"
                  - "amplify:ListBranches"
                  - "appstream:Describe*"
                  - "appstream:List*"
                  - "backup:Get*"
                  - "backup:List*"
                  - "bedrock:List*"
                  - "bedrock:Get*"
                  - "cloudtrail:GetInsightSelectors"
                  - "codeartifact:List*"
                  - "codebuild:BatchGet*"
                  - "codebuild:ListReportGroups"
                  - "cognito-idp:GetUserPoolMfaConfig"
                  - "dlm:Get*"
                  - "drs:Describe*"
                  - "ds:Get*"
                  - "ds:Describe*"
                  - "ds:List*"
                  - "dynamodb:GetResourcePolicy"
                  - "ec2:GetEbsEncryptionByDefault"
                  - "ec2:GetSnapshotBlockPublicAccessState"
                  - "ec2:GetInstanceMetadataDefaults"
                  - "ecr:Describe*"
                  - "ecr:GetRegistryScanningConfiguration"
                  - "elasticfilesystem:DescribeBackupPolicy"
                  - "glue:GetConnections"
                  - "glue:GetMLTransforms"
                  - "glue:GetSecurityConfiguration*"
                  - "glue:SearchTables"
                  - "inspector2:BatchGetFindingDetails"
                  - "lambda:GetFunction*"
                  - "lambda:GetLayerVersion"
                  - "logs:FilterLogEvents"
                  - "lightsail:GetRelationalDatabases"
                  - "macie2:GetMacieSession"
                  - "macie2:GetAutomatedDiscoveryConfiguration"
                  - "s3:GetAccountPublicAccessBlock"
                  - "shield:DescribeProtection"
                  - "shield:GetSubscriptionState"
                  - "securityhub:GetFindings"
                  - "servicecatalog:Describe*"
                  - "servicecatalog:List*"
                  - "ssm:GetDocument"
                  - "ssm-incidents:List*"
                  - "states:ListTagsForResource"
                  - "support:Describe*"
                  - "tag:GetTagKeys"
                  - "wellarchitected:List*"
                Resource: "*"
              - Sid: AllowAPIGatewayReadOnly
                Effect: Allow
                Action:
                  - "apigateway:GET"
                Resource:
                  - "arn:*:apigateway:*::/restapis/*"
                  - "arn:*:apigateway:*::/apis/*"
                  - "arn:*:apigateway:*::/domainnames"
                  - "arn:*:apigateway:*::/domainnames/*"
      Tags:
        - Key: "ManagedBy"
          Value: "Sentasity-CloudFormation"
        - Key: "Purpose"
          Value: "Cost optimization and security scanning"

  SentasityReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SentasityReadOnlyRole
      Description: "Sentasity ReadOnly role for cost data and CUR access"
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: "arn:aws:iam::886557787053:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref SentasityExternalId
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/ReadOnlyAccess"
      Policies:
        - PolicyName: SentasityBillingReads
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Wildcard reads so new billing APIs work before ReadOnlyAccess adds them.
              - Sid: BillingReads
                Effect: Allow
                Action:
                  - "ce:Get*"
                  - "ce:List*"
                  - "ce:Describe*"
                  - "billing:Get*"
                  - "billing:List*"
                  - "bcm-data-exports:Get*"
                  - "bcm-data-exports:List*"
                  - "cur:Describe*"
                  - "cur:Get*"
                  - "cost-optimization-hub:Get*"
                  - "cost-optimization-hub:List*"
                  - "compute-optimizer:Get*"
                  - "compute-optimizer:Describe*"
                  - "billingconductor:Get*"
                  - "billingconductor:List*"
                  - "freetier:Get*"
                  - "freetier:List*"
                  - "invoicing:Get*"
                  - "invoicing:List*"
                  - "bcm-recommended-actions:List*"
                  - "bcm-dashboards:Get*"
                  - "bcm-dashboards:List*"
                  - "bcm-pricing-calculator:Get*"
                  - "bcm-pricing-calculator:List*"
                  - "consolidatedbilling:Get*"
                  - "consolidatedbilling:List*"
                  - "budgets:View*"
                  - "budgets:Describe*"
                  - "trustedadvisor:Get*"
                  - "trustedadvisor:List*"
                  - "sustainability:Get*"
                  - "savingsplans:Describe*"
                  - "savingsplans:List*"
                  - "organizations:Describe*"
                  - "organizations:List*"
                  - "resource-explorer-2:Get*"
                  - "resource-explorer-2:List*"
                  - "resource-explorer-2:Search"
                Resource: "*"
        - PolicyName: SentasityDenyDataReads
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # s3:GetObject stays allowed: CUR bucket names vary per customer.
              - Sid: DenyDataReads
                Effect: Deny
                Action:
                  - "secretsmanager:GetSecretValue"
                  - "ssm:GetParameter"
                  - "ssm:GetParameters"
                  - "ssm:GetParametersByPath"
                  - "ssm:GetParameterHistory"
                  - "dynamodb:GetItem"
                  - "dynamodb:BatchGetItem"
                  - "dynamodb:Query"
                  - "dynamodb:Scan"
                  - "dynamodb:PartiQLSelect"
                  - "dynamodb:GetRecords"
                  - "sqs:ReceiveMessage"
                  - "kinesis:GetRecords"
                  - "kinesis:GetShardIterator"
                  - "ec2:GetPasswordData"
                  - "ec2:GetConsoleOutput"
                  - "ec2:GetConsoleScreenshot"
                  - "codecommit:GetFile"
                  - "codecommit:GetBlob"
                  - "ecr:BatchGetImage"
                  - "ecr:GetDownloadUrlForLayer"
                  - "lambda:GetFunction"
                Resource: "*"
        - PolicyName: SentasityResourceExplorerInventory
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Create-only: turns on Resource Explorer, like the console's Turn on button.
              - Sid: ResourceExplorerInventory
                Effect: Allow
                Action:
                  - resource-explorer-2:CreateIndex
                  - resource-explorer-2:CreateView
                Resource: "*"
              - Sid: ResourceExplorerServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "arn:aws:iam::*:role/aws-service-role/resource-explorer-2.amazonaws.com/AWSServiceRoleForResourceExplorer"
                Condition:
                  StringEquals:
                    iam:AWSServiceName: resource-explorer-2.amazonaws.com
      Tags:
        - Key: "ManagedBy"
          Value: "Sentasity-CloudFormation"
        - Key: "Purpose"
          Value: "Cost and usage data access"

Outputs:
  # Bump on every template change; the daily stack sync reads it.
  TemplateVersion:
    Description: "Template version"
    Value: "3"

  ViewOnlyRoleArn:
    Description: "Security scanning role ARN"
    Value: !GetAtt SentasityViewOnlySecurityRole.Arn

  ReadOnlyRoleArn:
    Description: "Cost data role ARN"
    Value: !GetAtt SentasityReadOnlyRole.Arn
