AWSTemplateFormatVersion: '2010-09-09'
Description: "Sentasity org discovery role; turns on CloudTrail and StackSets trusted access. Management account only."

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Sentasity access"
        Parameters:
          - SentasityExternalId
      - Label:
          default: "Wrong-account check"
        Parameters:
          - SentasityAccountId
    ParameterLabels:
      SentasityExternalId:
        default: "Sentasity External ID"
      SentasityAccountId:
        default: "Only create in AWS account (optional)"

Parameters:
  SentasityExternalId:
    Type: String
    AllowedPattern: '^[\w+=,.@:\/-]{2,1224}$'
    ConstraintDescription: "2 to 1224 letters, digits, or + = , . @ : / - _"
    Description: "External ID from Sentasity. The Sentasity quick-create link fills it in."
  SentasityAccountId:
    Type: String
    Default: ""
    AllowedPattern: '^(\d{12})?$'
    ConstraintDescription: "Blank, or a 12-digit AWS account ID"
    Description: "Sentasity's setup links fill this in, so the stack can't be created in another account by mistake. Leave it blank when updating the stack or deploying by hand."

Rules:
  # A Sentasity quick-create link names the account it is for. Opened while
  # signed in to another account, the stack is refused before anything is
  # created. Blank checks nothing.
  MustBeTheLinkedAccount:
    RuleCondition: !Not [!Equals [!Ref SentasityAccountId, ""]]
    Assertions:
      - Assert: !Equals [!Ref SentasityAccountId, !Ref "AWS::AccountId"]
        AssertDescription: "This link is for the AWS account in 'Only create in AWS account', not this one. Sign in to that account and open the link again."

Resources:

  SentasityOrgDiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SentasityOrgDiscoveryRole
      Description: "Sentasity read-only access to AWS Organizations structure"
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: "arn:aws:iam::886557787053:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref SentasityExternalId
      Policies:
        - PolicyName: OrgDiscoveryReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowOrgDiscovery
                Effect: Allow
                Action:
                  - "organizations:DescribeOrganization"
                  - "organizations:ListRoots"
                  - "organizations:ListOrganizationalUnitsForParent"
                  - "organizations:ListAccountsForParent"
                  - "organizations:ListAccounts"
                  - "organizations:ListAWSServiceAccessForOrganization"
                  - "organizations:EnableAWSServiceAccess"
                  - "sts:GetCallerIdentity"
                  - "cloudformation:DescribeStackSet"
                  - "cloudformation:DescribeStackSetOperation"
                  - "cloudformation:ListStackInstances"
                  - "cloudformation:ListStackSetOperations"
                  - "cloudformation:ListStackSetOperationResults"
                  - "billing:GetBillingPreferences"
                Resource: "*"
      Tags:
        - Key: "ManagedBy"
          Value: "Sentasity-CloudFormation"

  ServiceAccessEnablerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: "Execution role for the Sentasity service-access enablement Lambda"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: "ManagedBy"
          Value: "Sentasity-CloudFormation"

  # Separate policy + the Lambda's DependsOn gives IAM time to propagate the role.
  ServiceAccessEnablerPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EnableServiceAccess
      Roles:
        - !Ref ServiceAccessEnablerRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowServiceAccessOps
            Effect: Allow
            Action:
              - "organizations:ListAWSServiceAccessForOrganization"
              - "organizations:EnableAWSServiceAccess"
              - "organizations:DescribeOrganization"
              - "organizations:ListDelegatedAdministrators"
              - "organizations:ListRoots"
              - "organizations:ListAccounts"
              - "cloudformation:ActivateOrganizationsAccess"
              - "cloudformation:DescribeOrganizationsAccess"
            Resource: "*"
          # Must stay "*": on a fresh org IAM checks GetRole against the bare-name ARN (#711).
          - Sid: AllowStackSetsGetRole
            Effect: Allow
            Action: "iam:GetRole"
            Resource: "*"
          # No iam:AWSServiceName condition: the internal request lacks the key (#711).
          - Sid: AllowStackSetsCreateSLR
            Effect: Allow
            Action: "iam:CreateServiceLinkedRole"
            Resource: "arn:aws:iam::*:role/aws-service-role/stacksets.cloudformation.amazonaws.com/AWSServiceRoleForCloudFormationStackSetsOrgAdmin"

  ServiceAccessEnablerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ServiceAccessEnablerPolicy
    Properties:
      Description: "Enables required AWS Organizations service access for Sentasity"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ServiceAccessEnablerRole.Arn
      Timeout: 60
      Tags:
        - Key: "ManagedBy"
          Value: "Sentasity-CloudFormation"
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3

          REQUIRED_SERVICES = [
              "cloudtrail.amazonaws.com",
              "member.org.stacksets.cloudformation.amazonaws.com",
          ]


          def send_response(event, context, status, reason=""):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason,
                  "PhysicalResourceId": event.get("PhysicalResourceId", "ServiceAccessEnabler"),
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
              }).encode("utf-8")

              url = event["ResponseURL"]
              req = urllib.request.Request(
                  url,
                  data=body,
                  method="PUT",
                  headers={
                      "Content-Type": "",
                      "Content-Length": str(len(body)),
                  },
              )
              urllib.request.urlopen(req)


          def handler(event, context):
              request_type = event.get("RequestType")
              print(f"RequestType: {request_type}")

              # Delete is a no-op: service access is never disabled.
              if request_type == "Delete":
                  print("Delete request — no-op, sending SUCCESS")
                  send_response(event, context, "SUCCESS")
                  return

              try:
                  client = boto3.client("organizations")

                  already_enabled = set()
                  paginator = client.get_paginator("list_aws_service_access_for_organization")
                  for page in paginator.paginate():
                      for svc in page.get("EnabledServicePrincipals", []):
                          already_enabled.add(svc["ServicePrincipal"])

                  print(f"Already enabled services: {already_enabled}")

                  for svc in REQUIRED_SERVICES:
                      if svc not in already_enabled:
                          print(f"Enabling service access: {svc}")
                          client.enable_aws_service_access(ServicePrincipal=svc)
                      else:
                          print(f"Already enabled, skipping: {svc}")

                  # Service-managed StackSets also need CloudFormation's own org-access activation.
                  cfn_client = boto3.client("cloudformation")
                  status_response = cfn_client.describe_organizations_access()
                  current_status = status_response.get("Status")
                  print(f"CloudFormation Organizations access status: {current_status}")

                  if current_status != "ACTIVE":
                      print("Activating CloudFormation Organizations access")
                      cfn_client.activate_organizations_access()
                  else:
                      print("CloudFormation Organizations access already active")

                  print("All required services enabled — sending SUCCESS")
                  send_response(event, context, "SUCCESS")

              except Exception as exc:
                  try:
                      send_response(
                          event,
                          context,
                          "FAILED",
                          reason=f"Error enabling service access: {exc}",
                      )
                  except Exception as send_exc:
                      print(f"Failed to send CFN response: {send_exc}")

  ServiceAccessEnabler:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt ServiceAccessEnablerFunction.Arn

Outputs:
  # Bump on every template change; the daily stack sync reads it.
  TemplateVersion:
    Description: "Template version"
    Value: "3"

  RoleArn:
    Value: !GetAtt SentasityOrgDiscoveryRole.Arn
    Description: "Org discovery role ARN"

  RoleName:
    Value: !Ref SentasityOrgDiscoveryRole
    Description: "Org discovery role name"
